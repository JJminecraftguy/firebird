name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GUI (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            zlib1g-dev \
            binutils \
            libgl1-mesa-dev

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}

      - name: Verify Qt and CMake
        run: |
          set -eux
          qmake6 -v
          test "$(qmake6 -query QT_VERSION)" = "6.12.0"
          cmake --version
          "$QT_ROOT_DIR/bin/qt-cmake" --version

      - name: Configure GUI application (CMake)
        run: |
          set -eux
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build GUI application
        run: |
          set -eux
          cmake --build build --parallel

      - name: Verify executable
        run: |
          set -eux
          test -f build/firebird-emu
          file build/firebird-emu
          chmod +x build/firebird-emu

      - name: Prepare artifact
        run: |
          set -eux
          mkdir -p artifacts
          cp build/firebird-emu artifacts/
          cp resources/org.firebird-emus.firebird-emu.png artifacts/ 2>/dev/null || true
          printf 'Architecture: %s\n' '${{ matrix.arch }}' > artifacts/BUILD-INFO.txt
          printf 'Qt: 6.12.0\n' >> artifacts/BUILD-INFO.txt
          printf 'Commit: %s\n' '${{ github.sha }}' >> artifacts/BUILD-INFO.txt

      - name: Upload GUI executable
        uses: actions/upload-artifact@v6
        with:
          name: firebird-gui-linux-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
