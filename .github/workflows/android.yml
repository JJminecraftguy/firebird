name: Build for Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · universal
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install Qt 6.12.0 (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true

      - name: Capture arm64 Qt root
        run: |
          set -euo pipefail
          echo "ARM64_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Install Qt 6.12.0 (armeabi-v7a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_armv7'
          cache: true

      - name: Capture armv7 Qt root
        run: |
          set -euo pipefail
          echo "ARMV7_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

      # Single configure with QT_ANDROID_BUILD_ALL_ABIS=ON. Qt drives one
      # androiddeployqt invocation per ABI and Gradle assembles a single APK
      # containing both lib/arm64-v8a/ and lib/armeabi-v7a/. No manual merge.
      - name: Configure and build (all ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          sh "$ARM64_QT_ROOT/bin/qt-cmake" -S . -B build-all \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_BUILD_ALL_ABIS=ON
          cmake --build build-all --parallel
          cmake --build build-all --target apk

      - name: Sign APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT"
          mkdir -p "$ROOT/dist"

          APK_IN="$(find build-all/android-build/build/outputs/apk/release \
                       -name '*.apk' -not -name '*-signed.apk' -print -quit)"
          test -n "$APK_IN" || {
            echo "::error::APK not found under build-all/android-build/build/outputs/apk/release"
            find build-all -name '*.apk' >&2
            exit 1
          }
          echo "Found APK: $APK_IN"

          OUT="$ROOT/dist/firebird-emu-universal.apk"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"

          if [ -n "${ANDROID_KEYSTORE_PWD:-}" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$ROOT/keystore.jks"
            "$APKSIGNER" sign \
              --ks "$ROOT/keystore.jks" \
              --ks-key-alias firebirdemugh \
              --ks-pass "pass:${ANDROID_KEYSTORE_PWD}" \
              --key-pass "pass:${ANDROID_KEYSTORE_PWD}" \
              --out "$OUT" "$APK_IN"
          else
            echo "::warning::No release keystore available (fork PR?); signing with the debug key."
            keytool -genkeypair -keystore "$ROOT/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            "$APKSIGNER" sign \
              --ks "$ROOT/debug.keystore" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out "$OUT" "$APK_IN"
          fi

          "$APKSIGNER" verify --print-certs "$OUT"

          AAPT2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          echo "--- badging ---"
          "$AAPT2" dump badging "$OUT" | grep -E "^(package|native-code|sdkVersion|targetSdkVersion):" || true

          NATIVE="$("$AAPT2" dump badging "$OUT" | sed -n "s/^native-code: \(.*\)/\1/p")"
          echo "$NATIVE" | grep -q "arm64-v8a"   || { echo "::error::APK lacks arm64-v8a"; exit 1; }
          echo "$NATIVE" | grep -q "armeabi-v7a" || { echo "::error::APK lacks armeabi-v7a"; exit 1; }

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-android9plus-universal
          path: dist/firebird-emu-universal.apk
          if-no-files-found: error
