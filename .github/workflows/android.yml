name: Test Android Qt 6.12

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qt611-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.abi }} · Qt 6.12.0 · API 28+
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: armeabi-v7a
            qt_arch: android_armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      - name: Install SDK platform and build tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install Qt 6.12.0 (${{ matrix.abi }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: '${{ matrix.qt_arch }}'
          cache: true

      - name: Pin Gradle wrapper to 9.5.1
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Verify toolchain
        run: |
          qmake -v
          echo "NDK:  ${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "JDK:  $(java -version 2>&1 | head -1)"
          ADQ="$(qmake -query QT_INSTALL_BINS)/androiddeployqt"
          [ -x "$ADQ" ] || ADQ="$(qmake -query QT_HOST_BINS 2>/dev/null)/androiddeployqt"
          [ -x "$ADQ" ] || ADQ="$(find "${QT_ROOT_DIR:-$PWD/..}/.." -name androiddeployqt -type f -executable 2>/dev/null | head -n1)"
          echo "androiddeployqt: $ADQ"
          [ -x "$ADQ" ] || { echo "error: androiddeployqt not found" >&2; exit 1; }

      - name: Build firebird (${{ matrix.abi }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir build && cd build
          qmake ../firebird.pro CONFIG+=release \
            ANDROID_MIN_SDK_VERSION=28 \
            ANDROID_TARGET_SDK_VERSION=36
          make -j"$(nproc)" 2>&1 | tail -40

      - name: Install native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd build
          make INSTALL_ROOT="$PWD/android-build" install

      - name: Pack APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          cd build
          ADQ="$(qmake -query QT_INSTALL_BINS)/androiddeployqt"
          [ -x "$ADQ" ] || ADQ="$(qmake -query QT_HOST_BINS 2>/dev/null)/androiddeployqt"
          [ -x "$ADQ" ] || ADQ="$(find "${QT_ROOT_DIR:-$PWD/..}/.." -name androiddeployqt -type f -executable 2>/dev/null | head -n1)"
          [ -x "$ADQ" ] || { echo "error: androiddeployqt not found" >&2; exit 1; }
          echo "Using $ADQ"

          APK="$PWD/android-build/firebird-emu-${{ matrix.abi }}.apk"
          if [ -n "${ANDROID_KEYSTORE_PWD:-}" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks
            "$ADQ" \
              --android-platform android-36 \
              --input android-firebird-emu-deployment-settings.json \
              --output "$PWD/android-build" \
              --apk "$APK" \
              --sign keystore.jks firebirdemugh \
              --storepass "$ANDROID_KEYSTORE_PWD"
          else
            "$ADQ" \
              --android-platform android-36 \
              --input android-firebird-emu-deployment-settings.json \
              --output "$PWD/android-build" \
              --apk "$APK"
          fi
          test -f "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-qt612-${{ matrix.abi }}
          path: build/android-build/firebird-emu-${{ matrix.abi }}.apk
          if-no-files-found: error
