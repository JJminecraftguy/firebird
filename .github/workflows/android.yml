name: Build for Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: android-modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install Qt 6.12.0 (ARM64 + ARM32)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a,android_armv7'
          cache: true

      # qmake ANDROID_ABIS="arm64-v8a armeabi-v7a"  ->  QT_ANDROID_BUILD_ALL_ABIS=ON
      # qmake ANDROID_MIN_SDK_VERSION / TARGET_SDK_VERSION -> QT_ANDROID_* (-D overrides
      # the defaults baked into CMakeLists.txt, which only set them if not defined)
      - name: Configure (CMake)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_BUILD_ALL_ABIS=ON \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_TARGET_SDK_VERSION=36

      - name: Build firebird (ARM64 + ARM32)
        run: cmake --build build --parallel

      # The `apk` target drives androiddeployqt and stages the .so files from both
      # per-ABI builds into a single unsigned universal APK.
      - name: Pack universal APK
        run: |
          set -euo pipefail
          cmake --build build --target apk

          APK="$(find build -path '*android-build/firebird-emu.apk' -print -quit)"
          test -n "$APK" || { echo "error: APK not produced" >&2; find build -name '*.apk' >&2; exit 1; }
          install -D "$APK" build/firebird-emu.apk

          echo "APK contents (native libs):"
          unzip -l build/firebird-emu.apk | grep 'lib/'
          unzip -l build/firebird-emu.apk | grep -q 'lib/arm64-v8a/'    || { echo "error: arm64-v8a missing" >&2; exit 1; }
          unzip -l build/firebird-emu.apk | grep -q 'lib/armeabi-v7a/'  || { echo "error: armeabi-v7a missing" >&2; exit 1; }

      # Same keystore/alias as the qmake workflow's `androiddeployqt --sign`.
      # apksigner's --key-pass defaults to --ks-pass, matching androiddeployqt's
      # behaviour of using --storepass for both, so both are passed explicitly here.
      - name: Sign APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          APK="build/firebird-emu.apk"
          test -f "$APK"

          if [ -z "${ANDROID_KEYSTORE_PWD:-}" ]; then
            echo "No signing key configured, leaving the APK unsigned."
            exit 0
          fi

          echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks

          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias firebirdemugh \
            --ks-pass "pass:${ANDROID_KEYSTORE_PWD}" \
            --key-pass "pass:${ANDROID_KEYSTORE_PWD}" \
            --out "${APK}.signed" \
            "$APK"
          mv "${APK}.signed" "$APK"

          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-android-universal
          path: build/firebird-emu.apk
          if-no-files-found: error
