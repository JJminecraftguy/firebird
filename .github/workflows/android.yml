name: Build for Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-modern-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PACKAGE_NAME: ''

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Resolve package name
        run: |
          set -euo pipefail
          PKG="${ANDROID_PACKAGE_NAME:-}"
          if [ -z "$PKG" ] && [ -f android/AndroidManifest.xml ]; then
            PKG="$(grep -oP 'package="\K[^"]+' android/AndroidManifest.xml | head -n1 || true)"
          fi
          if [ -z "$PKG" ]; then
            echo "::error::could not determine the Android package name; set ANDROID_PACKAGE_NAME"
            exit 1
          fi
          echo "ANDROID_PACKAGE_NAME=$PKG" >> "$GITHUB_ENV"
          echo "Using package name: $PKG"

      - name: Install Qt 6.12.0 (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true

      - name: Capture arm64 Qt root
        run: |
          set -euo pipefail
          echo "ARM64_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Install Qt 6.12.0 (armeabi-v7a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_armv7'
          cache: true

      - name: Capture armv7 Qt root
        run: |
          set -euo pipefail
          echo "ARMV7_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Build (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          sh "$ARM64_QT_ROOT/bin/qt-cmake" -S . -B build-arm64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 --parallel
          cmake --build build-arm64 --target apk

      - name: Build (armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          sh "$ARMV7_QT_ROOT/bin/qt-cmake" -S . -B build-armv7 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-armv7 --parallel
          cmake --build build-armv7 --target apk

      - name: Merge arm64 + armv7 into universal APK
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT"

          APK64="$(find build-arm64 -name '*.apk' -not -path '*intermediates*' -print -quit)"
          APK32="$(find build-armv7 -name '*.apk' -not -path '*intermediates*' -print -quit)"
          test -n "$APK64" || { echo "::error::arm64 APK not found"; find build-arm64 -name '*.apk' >&2; exit 1; }
          test -n "$APK32" || { echo "::error::armv7 APK not found"; find build-armv7 -name '*.apk' >&2; exit 1; }

          unzip -l "$APK64" | grep -q 'lib/arm64-v8a/'   || { echo "::error::arm64 APK lacks lib/arm64-v8a"; exit 1; }
          unzip -l "$APK32" | grep -q 'lib/armeabi-v7a/' || { echo "::error::armv7 APK lacks lib/armeabi-v7a"; exit 1; }

          rm -rf "$ROOT/merge"
          mkdir -p "$ROOT/merge/base" "$ROOT/merge/other" "$ROOT/merge/merged"

          unzip -q "$APK64" -d "$ROOT/merge/base"
          unzip -q "$APK32" -d "$ROOT/merge/other"

          cp -a "$ROOT/merge/base/." "$ROOT/merge/merged/"
          mkdir -p "$ROOT/merge/merged/lib"
          rm -rf "$ROOT/merge/merged/lib/armeabi-v7a"
          cp -a "$ROOT/merge/other/lib/armeabi-v7a" "$ROOT/merge/merged/lib/"
          rm -rf "$ROOT/merge/merged/META-INF"

          cd "$ROOT/merge/merged"
          zip -qr ../merged-unaligned.apk . \
            -x 'resources.arsc' 'lib/arm64-v8a/*.so' 'lib/armeabi-v7a/*.so'
          zip -q -0 ../merged-unaligned.apk resources.arsc
          zip -q -0 ../merged-unaligned.apk lib/arm64-v8a/*.so lib/armeabi-v7a/*.so

          echo "Merged APK: $(ls -la "$ROOT/merge/merged-unaligned.apk")"

      - name: Patch libs.xml load order (apktool), align, sign and verify
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT"
          mkdir -p "$ROOT/dist"

          APKTOOL="$RUNNER_TEMP/apktool.jar"
          if [ ! -f "$APKTOOL" ]; then
            curl -fsSL -o "$APKTOOL" \
              https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          fi

          # Decode the merged APK
          rm -rf "$ROOT/patch"
          mkdir -p "$ROOT/patch"
          java -jar "$APKTOOL" d -f -o "$ROOT/patch/decoded" \
            "$ROOT/merge/merged-unaligned.apk"

          # Reorder qt_libs so libQt6Core loads first
          DECODED_DIR="$ROOT/patch/decoded" python3 - <<'PY'
          import os, pathlib, re, sys

          decoded = pathlib.Path(os.environ["DECODED_DIR"])
          patched = False

          for p in (decoded / "res").rglob("*.xml"):
              if not any(part.startswith("values") for part in p.parts):
                  continue
              text = p.read_text()
              if 'name="qt_libs"' not in text:
                  continue

              m = re.search(r'(<string-array name="qt_libs">)(.*?)(</string-array>)',
                            text, re.S)
              if not m:
                  print(f"ERROR: could not parse qt_libs array in {p}", file=sys.stderr)
                  sys.exit(1)

              items = re.findall(r"<item>(.*?)</item>", m.group(2))
              if not items:
                  print(f"ERROR: qt_libs array is empty in {p}", file=sys.stderr)
                  sys.exit(1)

              # Qt6Core must load first (its JNI_OnLoad initialises the JavaVM).
              # Everything else keeps its original relative order.
              ordered = sorted(items, key=lambda x: (0 if x.startswith("Qt6Core") else 1))

              if ordered == items:
                  print(f"qt_libs already in correct order in {p}")
              else:
                  body = "\n        ".join(f"<item>{i}</item>" for i in ordered)
                  replacement = m.group(1) + "\n        " + body + "\n    " + m.group(3)
                  p.write_text(text.replace(m.group(0), replacement))
                  print(f"Reordered qt_libs in {p}")
                  print(f"  was: {items}")
                  print(f"  now: {ordered}")

              patched = True
              break

          if not patched:
              print("ERROR: no res/values/*.xml containing qt_libs was found",
                    file=sys.stderr)
              sys.exit(1)
          PY

          # Rebuild with apktool
          java -jar "$APKTOOL" b -f -o "$ROOT/patch/rebuilt.apk" "$ROOT/patch/decoded"

          # apktool may recompress native libs. Rebuild the zip so .so files
          # stay stored and resources.arsc stays uncompressed (required by
          # extractNativeLibs=false, which is the default for targetSdk >= 23).
          rm -rf "$ROOT/patch/rezip"
          mkdir -p "$ROOT/patch/rezip"
          unzip -q "$ROOT/patch/rebuilt.apk" -d "$ROOT/patch/rezip"
          rm -rf "$ROOT/patch/rezip/META-INF"
          (
            cd "$ROOT/patch/rezip"
            zip -qr ../rezip-unaligned.apk . \
              -x 'resources.arsc' 'lib/arm64-v8a/*.so' 'lib/armeabi-v7a/*.so'
            zip -q -0 ../rezip-unaligned.apk resources.arsc
            zip -q -0 ../rezip-unaligned.apk \
              lib/arm64-v8a/*.so lib/armeabi-v7a/*.so
          )

          ZIPALIGN="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -f -P 16 4 "$ROOT/patch/rezip-unaligned.apk" \
            "$ROOT/patch/aligned.apk"
          "$ZIPALIGN" -c -P 16 4 "$ROOT/patch/aligned.apk"

          # Sanity: every .so must be stored (not deflated)
          if unzip -lv "$ROOT/patch/aligned.apk" | grep '\.so$' | grep -qv 'Stored'; then
            echo "::error::some .so files are compressed; extractNativeLibs=false requires them stored"
            unzip -lv "$ROOT/patch/aligned.apk" | grep '\.so$' >&2
            exit 1
          fi

          OUT="$ROOT/dist/firebird-emu-universal.apk"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"

          if [ -n "${ANDROID_KEYSTORE_PWD:-}" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$ROOT/keystore.jks"
            "$APKSIGNER" sign \
              --ks "$ROOT/keystore.jks" \
              --ks-key-alias firebirdemugh \
              --ks-pass "pass:${ANDROID_KEYSTORE_PWD}" \
              --key-pass "pass:${ANDROID_KEYSTORE_PWD}" \
              --out "$OUT" "$ROOT/patch/aligned.apk"
          else
            echo "::warning::No release keystore available (fork PR?); signing with the debug key."
            keytool -genkeypair -keystore "$ROOT/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            "$APKSIGNER" sign \
              --ks "$ROOT/debug.keystore" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out "$OUT" "$ROOT/patch/aligned.apk"
          fi

          "$APKSIGNER" verify --print-certs "$OUT"

          AAPT2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          echo "--- badging ---"
          "$AAPT2" dump badging "$OUT" | grep -E "^(package|native-code|sdkVersion|targetSdkVersion):" || true

          GOT_PKG="$("$AAPT2" dump badging "$OUT" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          test "$GOT_PKG" = "$ANDROID_PACKAGE_NAME" || {
            echo "::error::APK package is '$GOT_PKG', expected '$ANDROID_PACKAGE_NAME'"
            exit 1
          }
          NATIVE="$("$AAPT2" dump badging "$OUT" | sed -n "s/^native-code: \(.*\)/\1/p")"
          echo "$NATIVE" | grep -q "arm64-v8a"   || { echo "::error::universal APK lacks arm64-v8a"; exit 1; }
          echo "$NATIVE" | grep -q "armeabi-v7a" || { echo "::error::universal APK lacks armeabi-v7a"; exit 1; }

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-android9plus-universal
          path: dist/firebird-emu-universal.apk
          if-no-files-found: error
