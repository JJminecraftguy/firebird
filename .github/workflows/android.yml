name: Build for Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-modern-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PACKAGE_NAME: ''

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Resolve package name
        run: |
          set -euo pipefail
          PKG="${ANDROID_PACKAGE_NAME:-}"
          if [ -z "$PKG" ] && [ -f android/AndroidManifest.xml ]; then
            PKG="$(grep -oP 'package="\K[^"]+' android/AndroidManifest.xml | head -n1 || true)"
          fi
          if [ -z "$PKG" ]; then
            echo "::error::could not determine the Android package name; set ANDROID_PACKAGE_NAME"
            exit 1
          fi
          echo "ANDROID_PACKAGE_NAME=$PKG" >> "$GITHUB_ENV"
          echo "Using package name: $PKG"

      - name: Install Qt 6.12.0 (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true

      - name: Capture arm64 Qt root
        run: |
          set -euo pipefail
          echo "ARM64_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Install Qt 6.12.0 (armeabi-v7a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_armv7'
          cache: true

      - name: Capture armv7 Qt root
        run: |
          set -euo pipefail
          echo "ARMV7_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Configure and build (all ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          sh "$ARM64_QT_ROOT/bin/qt-cmake" -S . -B build-all \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_BUILD_ALL_ABIS=ON
          cmake --build build-all --parallel
          cmake --build build-all --target apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-android9plus-universal
          path: dist/firebird-emu-universal.apk
          if-no-files-found: error
