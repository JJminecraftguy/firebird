name: Build for Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install Qt 6.12.0 (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true

      - name: Capture arm64 Qt root
        run: |
          set -euo pipefail
          echo "ARM64_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          test -f "$QT_ROOT_DIR/bin/qt-cmake" || {
            echo "error: $QT_ROOT_DIR/bin/qt-cmake missing" >&2
            ls -la "$QT_ROOT_DIR/bin" >&2 || true
            exit 1
          }

      - name: Install Qt 6.12.0 (armeabi-v7a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'android'
          arch: 'android_armv7'
          cache: true

      - name: Capture armv7 Qt root
        run: |
          set -euo pipefail
          echo "ARMV7_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          test -f "$QT_ROOT_DIR/bin/qt-cmake" || {
            echo "error: $QT_ROOT_DIR/bin/qt-cmake missing" >&2
            ls -la "$QT_ROOT_DIR/bin" >&2 || true
            exit 1
          }

      - name: Configure + build (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          QTC="$ARM64_QT_ROOT/bin/qt-cmake"
          test -f "$QTC" || { echo "error: $QTC missing" >&2; exit 1; }
          find "$ARM64_QT_ROOT/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

          sh "$QTC" -S . -B build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_TARGET_SDK_VERSION=36

          cmake --build build-arm64 --parallel
          cmake --build build-arm64 --target apk

      - name: Configure + build (armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          QTC="$ARMV7_QT_ROOT/bin/qt-cmake"
          test -f "$QTC" || { echo "error: $QTC missing" >&2; exit 1; }
          find "$ARMV7_QT_ROOT/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

          sh "$QTC" -S . -B build-armv7 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_TARGET_SDK_VERSION=36

          cmake --build build-armv7 --parallel
          cmake --build build-armv7 --target apk

      - name: Merge universal APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT"

          APK64="$(find build-arm64 -name '*.apk' -not -path '*intermediates*' -not -name '*-signed.apk' -print -quit)"
          APK32="$(find build-armv7 -name '*.apk' -not -path '*intermediates*' -not -name '*-signed.apk' -print -quit)"
          test -n "$APK64" || { echo "error: arm64 APK not found" >&2; find build-arm64 -name '*.apk' >&2; exit 1; }
          test -n "$APK32" || { echo "error: armv7 APK not found" >&2; find build-armv7 -name '*.apk' >&2; exit 1; }
          echo "arm64 APK: $APK64"
          echo "armv7 APK: $APK32"

          unzip -l "$APK64" | grep -q 'lib/arm64-v8a/'   || { echo "error: arm64 APK lacks lib/arm64-v8a" >&2; exit 1; }
          unzip -l "$APK32" | grep -q 'lib/armeabi-v7a/' || { echo "error: armv7 APK lacks lib/armeabi-v7a" >&2; exit 1; }

          rm -rf "$ROOT/merge" "$ROOT/dist"
          mkdir -p "$ROOT/merge/base" "$ROOT/merge/other" "$ROOT/merge/merged" "$ROOT/dist"

          unzip -q "$APK64" -d "$ROOT/merge/base"
          unzip -q "$APK32" -d "$ROOT/merge/other"

          cp -a "$ROOT/merge/base/." "$ROOT/merge/merged/"
          mkdir -p "$ROOT/merge/merged/lib"
          rm -rf "$ROOT/merge/merged/lib/armeabi-v7a"
          cp -a "$ROOT/merge/other/lib/armeabi-v7a" "$ROOT/merge/merged/lib/"
          rm -rf "$ROOT/merge/merged/META-INF"

          cd "$ROOT/merge/merged"
          zip -qr ../unaligned.apk . \
            -x 'resources.arsc' 'lib/arm64-v8a/*.so' 'lib/armeabi-v7a/*.so'
          zip -q -0 ../unaligned.apk resources.arsc
          zip -q -0 ../unaligned.apk lib/arm64-v8a/*.so lib/armeabi-v7a/*.so
          cd "$ROOT/merge"

          ZIPALIGN="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/zipalign"
          if "$ZIPALIGN" 2>&1 | grep -q -- '-P '; then
            "$ZIPALIGN" -f -P 16 4 unaligned.apk aligned.apk
            "$ZIPALIGN" -c -P 16 4 aligned.apk
          else
            "$ZIPALIGN" -f -p 4 unaligned.apk aligned.apk
            "$ZIPALIGN" -c -p 4 aligned.apk
          fi

          unzip -l aligned.apk | grep -q 'lib/arm64-v8a/'   || { echo "error: universal APK lacks arm64-v8a" >&2; exit 1; }
          unzip -l aligned.apk | grep -q 'lib/armeabi-v7a/' || { echo "error: universal APK lacks armeabi-v7a" >&2; exit 1; }

          OUT="$ROOT/dist/firebird-emu-universal.apk"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [ -n "${ANDROID_KEYSTORE_PWD:-}" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$ROOT/keystore.jks"
            "$APKSIGNER" sign \
              --ks "$ROOT/keystore.jks" \
              --ks-key-alias firebirdemugh \
              --ks-pass "pass:${ANDROID_KEYSTORE_PWD}" \
              --key-pass "pass:${ANDROID_KEYSTORE_PWD}" \
              --out "$OUT" aligned.apk
            "$APKSIGNER" verify --print-certs "$OUT"
          else
            echo "No signing key configured, leaving the universal APK unsigned."
            cp aligned.apk "$OUT"
          fi

          echo "Universal APK native libraries:"
          unzip -l "$OUT" | grep 'lib/'

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-android9plus-universal
          path: dist/firebird-emu-universal.apk
          if-no-files-found: error
