name: Build for Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: armeabi-v7a
            qt_arch: android_armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # Qt 6.2's Gradle 7.2 / AGP 7.0.2 need JDK 11 for the actual build.
      - name: Set up JDK 11 (for the Qt 6.2 build)
        id: jdk11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin

      # setup-android's sdkmanager (cmdline-tools 22.0) refuses to run on < 17.
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r23b
          add-to-path: false

      - name: Install Qt 6.2 (${{ matrix.abi }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.2.4'
          host: 'linux'
          target: 'android'
          arch: '${{ matrix.qt_arch }}'
          cache: true

      - name: Verify toolchain
        run: |
          qmake -v
          echo "NDK:        ${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "JDK 11 home: ${{ steps.jdk11.outputs.path }}"
          echo "QT_ROOT_DIR: ${QT_ROOT_DIR:-unset}"
          echo "libexec:    $(qmake -query QT_INSTALL_LIBEXECS)"

      - name: Build firebird (${{ matrix.abi }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ steps.jdk11.outputs.path }}
        run: |
          echo "Build JDK: ${JAVA_HOME:-<unset>}"
          if [ -n "${JAVA_HOME:-}" ] && [ -x "$JAVA_HOME/bin/java" ]; then
            "$JAVA_HOME/bin/java" -version
          else
            echo "warning: JDK 11 not located, using default java for the compile"
            java -version
          fi
          mkdir build
          cd build
          qmake ../firebird.pro CONFIG+=release
          make -j"$(nproc)" apk_install_target

      - name: Pack APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ steps.jdk11.outputs.path }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          cd build

          # Qt 6 moved androiddeployqt to libexec; install-qt-action only
          # adds bin/ to PATH, so it must be invoked by absolute path.
          ADQ="$(qmake -query QT_INSTALL_LIBEXECS)/androiddeployqt"
          if [ ! -x "$ADQ" ]; then
            echo "not found at $ADQ; searching ${QT_ROOT_DIR:-$PWD/..}/.." >&2
            ADQ="$(find "${QT_ROOT_DIR:-$PWD/..}/.." -name androiddeployqt -type f -executable 2>/dev/null | head -n1)"
          fi
          if [ -z "$ADQ" ] || [ ! -x "$ADQ" ]; then
            echo "error: androiddeployqt not found" >&2
            exit 1
          fi
          echo "Using $ADQ"

          if [ -n "${JAVA_HOME:-}" ] && [ -x "$JAVA_HOME/bin/java" ]; then
            echo "Using $JAVA_HOME/bin/java"
            "$JAVA_HOME/bin/java" -version
          fi

          APK="$PWD/android-build/firebird-emu-${{ matrix.abi }}.apk"
          if [ -n "${ANDROID_KEYSTORE_PWD:-}" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks
            "$ADQ" \
              --input android-firebird-emu-deployment-settings.json \
              --output "$PWD/android-build" \
              --apk "$APK" \
              --sign keystore.jks firebirdemugh \
              --storepass "$ANDROID_KEYSTORE_PWD"
          else
            "$ADQ" \
              --input android-firebird-emu-deployment-settings.json \
              --output "$PWD/android-build" \
              --apk "$APK"
          fi
          test -f "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-android-${{ matrix.abi }}
          path: build/android-build/firebird-emu-${{ matrix.abi }}.apk
          if-no-files-found: error
