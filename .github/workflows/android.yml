name: Build for Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Qt 6.4 still has no qmake multi-ABI support, so each ABI is its own
        # Qt install and its own build.
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: armeabi-v7a
            qt_arch: android_armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # One JDK for everything: Qt 6.4.3's Gradle 7.4.2 supports Java 17,
      # and setup-android's sdkmanager needs 17 anyway.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      # Qt 6.4 recommends platform 31 / build-tools 31.0.0.
      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          # Qt 6.4 uses the same NDK as 6.2: r23b (23.1.7779620).
          ndk-version: r23b
          add-to-path: false

      - name: Install Qt 6.4.3 (${{ matrix.abi }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.3'
          host: 'linux'
          target: 'android'
          arch: '${{ matrix.qt_arch }}'
          cache: true

      - name: Verify toolchain
        run: |
          qmake -v
          echo "NDK:        ${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "QT_INSTALL_BINS: $(qmake -query QT_INSTALL_BINS)"
          test -x "$(qmake -query QT_INSTALL_BINS)/androiddeployqt"

      - name: Build firebird (${{ matrix.abi }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir build
          cd build
          qmake ../firebird.pro CONFIG+=release
          make -j"$(nproc)" apk_install_target

      - name: Pack APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          cd build

          # Qt 6.4 keeps androiddeployqt in the host bin dir (not libexec).
          ADQ="$(qmake -query QT_INSTALL_BINS)/androiddeployqt"
          if [ ! -x "$ADQ" ]; then
            ADQ="$(find "${QT_ROOT_DIR:-$PWD/..}/.." -name androiddeployqt -type f -executable 2>/dev/null | head -n1)"
          fi
          [ -x "$ADQ" ] || { echo "error: androiddeployqt not found" >&2; exit 1; }
          echo "Using $ADQ"

          # Qt 6.4.3 still converts compileSdkVersion to an integer, so avoid
          # the runner's "android-36-ext19" platform by pinning android-31.
          APK="$PWD/android-build/firebird-emu-${{ matrix.abi }}.apk"
          if [ -n "${ANDROID_KEYSTORE_PWD:-}" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks
            "$ADQ" \
              --android-platform android-31 \
              --input android-firebird-emu-deployment-settings.json \
              --output "$PWD/android-build" \
              --apk "$APK" \
              --sign keystore.jks firebirdemugh \
              --storepass "$ANDROID_KEYSTORE_PWD"
          else
            "$ADQ" \
              --android-platform android-31 \
              --input android-firebird-emu-deployment-settings.json \
              --output "$PWD/android-build" \
              --apk "$APK"
          fi
          test -f "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-android-${{ matrix.abi }}
          path: build/android-build/firebird-emu-${{ matrix.abi }}.apk
          if-no-files-found: error
