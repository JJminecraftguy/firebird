name: Build for Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Qt 6.2 has no multi-ABI support with qmake (that arrived in 6.3, CMake
        # only), so each ABI is a separate Qt install and a separate build.
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: armeabi-v7a
            qt_arch: android_armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      # --- JDK 11 first: this is what Qt 6.2's Gradle 7.2 / AGP 7.0.2 need.
      - name: Set up JDK 11 (for the Qt 6.2 build)
        id: jdk11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin

      # --- JDK 17 second: setup-android's sdkmanager (cmdline-tools 22.0)
      #     refuses to run on anything older than 17.
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      # Runs under JDK 17 (currently on PATH). Required by Qt 6.2.
      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          # NDK required by Qt 6.2 is 23.1.7779620 (r23b).
          ndk-version: r23b
          add-to-path: false

      - name: Install Qt 6.2 (${{ matrix.abi }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.2.4'
          host: 'linux'
          target: 'android'
          arch: '${{ matrix.qt_arch }}'
          cache: true

      - name: Verify toolchain
        run: |
          qmake -v
          echo "NDK:       ${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "Build JDK: ${{ steps.jdk11.outputs.java-home }}"

      # --- Back to JDK 11 for the actual compile. Gradle honours JAVA_HOME,
      #     and putting JDK 11's bin first on PATH also covers anything that
      #     shells out to a bare `java`.
      - name: Build firebird (${{ matrix.abi }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ steps.jdk11.outputs.java-home }}
        run: |
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          mkdir build
          cd build
          qmake ../firebird.pro CONFIG+=release
          make -j"$(nproc)" apk_install_target

      # androiddeployqt picks android-31 automatically: it is the only platform installed.
      - name: Pack APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ steps.jdk11.outputs.java-home }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          cd build
          APK="$PWD/android-build/firebird-emu-${{ matrix.abi }}.apk"
          if [ -n "$ANDROID_KEYSTORE_PWD" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > keystore.jks
            androiddeployqt \
              --input android-firebird-emu-deployment-settings.json \
              --output "$PWD/android-build" \
              --apk "$APK" \
              --sign keystore.jks firebirdemugh \
              --storepass "$ANDROID_KEYSTORE_PWD"
          else
            androiddeployqt \
              --input android-firebird-emu-deployment-settings.json \
              --output "$PWD/android-build" \
              --apk "$APK"
          fi
          test -f "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-android-${{ matrix.abi }}
          path: build/android-build/firebird-emu-${{ matrix.abi }}.apk
          if-no-files-found: error
