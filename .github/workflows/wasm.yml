name: Build for WebAssembly

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Emscripten 5.0.5
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '5.0.5'
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten version
        run: emcc --version | head -1

      - name: Install Qt 6.12.0 for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Verify Qt and CMake
        run: |
          set -eux
          test -f "$QT_ROOT_DIR/bin/qt-cmake"
          "$QT_ROOT_DIR/bin/qt-cmake" --version
          cmake --version

      # qt-cmake picks up Qt's wasm toolchain (qt.toolchain.cmake) from the
      # installed Qt automatically, including the emscripten setup. No
      # -DCMAKE_TOOLCHAIN_FILE or -DQT_HOST_PATH flags are needed.
      - name: Configure (CMake)
        run: |
          set -eux
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set -eux
          cmake --build build --parallel

      - name: Verify build outputs
        run: |
          set -eux
          echo "=== build directory ==="
          ls -la build/
          echo "=== wasm outputs ==="
          ls -la build/*.html build/*.js build/*.wasm build/*.svg 2>&1 || true

          test -f build/firebird-emu.html
          test -f build/firebird-emu.js
          test -f build/firebird-emu.wasm
          test -f build/qtloader.js

      - name: Prepare artifact
        run: |
          set -eux
          mkdir -p artifacts
          cp build/firebird-emu.html artifacts/
          cp build/firebird-emu.js artifacts/
          cp build/firebird-emu.wasm artifacts/
          cp build/qtloader.js artifacts/
          # Optional cosmetic asset; older Qt versions include it, some newer
          # ones don't. Don't fail the build if it's absent.
          cp build/qtlogo.svg artifacts/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebird-emu-wasm
          path: artifacts/
          if-no-files-found: error
