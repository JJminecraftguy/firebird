name: Build for WebAssembly

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Emscripten 5.0.5
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '5.0.5'
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten version
        run: emcc --version | head -1

      - name: Install Qt 6.12.0 for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Verify Qt and CMake
        run: |
          set -eux
          QTC="$QT_ROOT_DIR/bin/qt-cmake"
          test -f "$QTC" || { echo "error: $QTC missing" >&2; ls -la "$QT_ROOT_DIR/bin" >&2; exit 1; }

          find "$QT_ROOT_DIR/bin" "$QT_ROOT_DIR/libexec" \
            -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

          sh "$QTC" --version
          cmake --version

      - name: Configure (CMake)
        run: |
          set -eux
          QTC="$QT_ROOT_DIR/bin/qt-cmake"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true
          sh "$QTC" -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set -eux
          cmake --build build --parallel

      - name: Verify build outputs
        run: |
          set -eux
          echo "=== build directory ==="
          ls -la build/
          echo "=== wasm outputs ==="
          ls -la build/*.html build/*.js build/*.wasm build/*.svg 2>&1 || true

          test -f build/firebird-emu.html
          test -f build/firebird-emu.js
          test -f build/firebird-emu.wasm
          test -f build/qtloader.js

      - name: Prepare artifact
        run: |
          set -eux
          mkdir -p artifacts
          cp build/firebird-emu.html artifacts/
          cp build/firebird-emu.js artifacts/
          cp build/firebird-emu.wasm artifacts/
          cp build/qtloader.js artifacts/
          cp build/qtlogo.svg artifacts/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebird-emu-wasm
          path: artifacts/
          if-no-files-found: error

      - name: Deploy to gh-pages/wasm
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts
          destination_dir: wasm
          keep_files: true
          commit_message: "Deploy wasm ${{ github.sha }}"
