name: Build macOS

on:
  push:
    branches: [ master, ci/macOS ]
  pull_request:
    branches: [ master, ci/macOS ]
  release:
    types: [published]

jobs:
  build:
    name: "Build: ${{ matrix.arch }}"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The JIT is specific to the architecture, so each one is built
        # separately. The Qt 6 kit for macOS is universal, so the x86_64
        # build is simply cross-compiled on the (Apple Silicon) runner.
        arch: [arm64, x86_64]

    steps:
    - name: Checkout Git Repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Install Qt 6.12.0
      uses: jurplel/install-qt-action@v4
      with:
          version: '6.12.0'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

    - name: Build firebird-emu (${{ matrix.arch }}) with CMake
      run: |
        set -eux

        QTC="$QT_ROOT_DIR/bin/qt-cmake"
        test -f "$QTC" || { echo "error: $QTC missing" >&2; ls -la "$QT_ROOT_DIR/bin" >&2; exit 1; }
        # Defensive: cached Qt trees occasionally come back without the exec
        # bit. Repair it, then invoke via sh so a missing bit can never fail
        # the step again.
        find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

        "$QT_ROOT_DIR/bin/qmake" -v

        # CMAKE_OSX_ARCHITECTURES pins the single architecture the JIT needs,
        # replacing the .pro's QMAKE_APPLE_DEVICE_ARCHS. CMakeLists.txt
        # enforces exactly one arch and errors out otherwise, mirroring the
        # .pro's !count(QMAKE_APPLE_DEVICE_ARCHS, 1) check.
        sh "$QTC" -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
        cmake --build build --parallel

        # Make sure the JIT matches the architecture the binary was built for
        lipo -archs build/firebird-emu.app/Contents/MacOS/firebird-emu \
          | tee /dev/stderr | grep -qx "${{ matrix.arch }}"

        macdeployqt build/firebird-emu.app -qmldir=qml
        mkdir -p /tmp/firebird-emu_macOS/
        mv build/firebird-emu.app /tmp/firebird-emu_macOS/

        # macdeployqt changes the binaries, which invalidates their signatures. Apple Silicon
        # refuses to run unsigned code, so sign ad-hoc. This is replaced by the real
        # signature in the next step if the signing secrets are available.
        codesign --force --deep --sign - /tmp/firebird-emu_macOS/firebird-emu.app
        codesign --verify --deep --strict /tmp/firebird-emu_macOS/firebird-emu.app

    - name: "Codesign firebird-emu.app"
      shell: bash
      env:
          HAVE_SECRETS: ${{ secrets.MACOS_CERTIFICATE_PWD != '' }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
          MACOS_CODESIGN_IDENT: ${{ secrets.MACOS_CODESIGN_IDENT }}
      if: ${{ runner.os == 'macOS' && github.repository == 'nspire-emus/firebird' && env.HAVE_SECRETS == 'true' }}
      run: |
          echo $MACOS_CERTIFICATE | base64 -d > certificate.p12
          security create-keychain -p $MACOS_KEYCHAIN_PWD build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p $MACOS_KEYCHAIN_PWD build.keychain
          security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $MACOS_KEYCHAIN_PWD build.keychain
          app=/tmp/firebird-emu_macOS/firebird-emu.app
          # Sign bundled Qt frameworks/plugins first, without app entitlements.
          find "$app/Contents" -depth \( -type d -name '*.framework' -o -type f -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' code; do
              /usr/bin/codesign --force --verbose --sign "$MACOS_CODESIGN_IDENT" --timestamp "$code"
            done
          /usr/bin/codesign --force --verbose --sign "$MACOS_CODESIGN_IDENT" --timestamp --options runtime --entitlements resources/macos/firebird.entitlements "$app"
          /usr/bin/codesign --verify --deep --strict --verbose "$app"

    - name: "Create the DMG"
      run: |
          brew install create-dmg || brew install create-dmg; # we try twice because sometimes it fails...
          # The codesign variable may be empty (for forks) but that's fine, create-dmg only does code-signing if it's not empty.
          createDmgArgs="--codesign '${{ secrets.MACOS_CODESIGN_IDENT }}' \
              --volname 'firebird-emu_macOS_${{ matrix.arch }}' \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 64 \
              --icon 'firebird-emu.app' 125 200 \
              --app-drop-link 400 200 \
              'firebird-emu_macOS_${{ matrix.arch }}.dmg' \
              '/tmp/firebird-emu_macOS/'"
          eval "create-dmg $createDmgArgs" || eval "create-dmg $createDmgArgs" # We also retry just in case...

    - name: "[macOS] Notarize and staple DMG"
      env:
        HAVE_SECRETS: ${{ secrets.APPLE_NOTARIZATION_PASSWORD != '' }}
        APPLE_NOTARIZATION_USERNAME: ${{ secrets.APPLE_NOTARIZATION_USERNAME }}
        APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
        APPLE_NOTARIZATION_TEAMID: ${{ secrets.APPLE_NOTARIZATION_TEAMID }}
      if: ${{ runner.os == 'macOS' && github.repository == 'nspire-emus/firebird' && env.HAVE_SECRETS == 'true' }}
      run: |
        xcrun notarytool store-credentials "notarytool-profile" --apple-id "$APPLE_NOTARIZATION_USERNAME" --team-id "$APPLE_NOTARIZATION_TEAMID" --password "$APPLE_NOTARIZATION_PASSWORD"
        xcrun notarytool submit "firebird-emu_macOS_${{ matrix.arch }}.dmg" --keychain-profile "notarytool-profile" --wait
        xcrun stapler staple "firebird-emu_macOS_${{ matrix.arch }}.dmg"

    - name: "Upload DMG"
      uses: actions/upload-artifact@v7
      with:
          name: firebird-emu_macOS_${{ matrix.arch }}
          path: firebird-emu_macOS_${{ matrix.arch }}.dmg
