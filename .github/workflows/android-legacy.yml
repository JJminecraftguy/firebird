name: Build for Android (legacy)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-legacy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build · ${{ matrix.label }} (universal)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Qt 6.4.3 — Android 6.0+ (API 23) ──
          - qt_version: '6.4.3'
            qt_host: 'linux'
            min_sdk: 23
            target_sdk: 31
            ndk: 'r23b'
            gradle: '7.4.2'
            jdk: '17'
            sdk_platform: 'android-31'
            sdk_platform_num: 31
            build_tools: '31.0.0'
            deploy_platform: 'android-31'
            label: 'android6-7'

          # ── Qt 6.7.3 — Android 8.0+ (API 26) ──
          - qt_version: '6.7.3'
            qt_host: 'all_os'
            min_sdk: 26
            target_sdk: 34
            ndk: 'r26b'
            gradle: '8.3'
            jdk: '17'
            sdk_platform: 'android-34'
            sdk_platform_num: 34
            build_tools: '34.0.0'
            deploy_platform: 'android-34'
            label: 'android8'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          java-version: '${{ matrix.jdk }}'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.04

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;${{ matrix.sdk_platform }}" \
            "build-tools;${{ matrix.build_tools }}" \
            "platform-tools"

      - name: Pin the SDK platform for legacy Qt
        run: |
          set -euo pipefail

          KEEP="${{ matrix.sdk_platform }}"

          if [ ! -d "$ANDROID_SDK_ROOT/platforms/$KEEP" ]; then
            echo "::error::matrix platform $KEEP is missing"
            ls -la "$ANDROID_SDK_ROOT/platforms" >&2
            exit 1
          fi

          for dir in "$ANDROID_SDK_ROOT/platforms"/*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            if [ "$name" = "$KEEP" ]; then
              echo "Keeping platforms;$name"
              continue
            fi
            echo "Removing platforms;$name"
            sdkmanager --uninstall "platforms;$name" >/dev/null 2>&1 \
              || rm -rf "$dir"
          done

          echo "--- remaining platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ matrix.ndk }}
          add-to-path: false

      - name: Install Qt ${{ matrix.qt_version }} (arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ matrix.qt_version }}'
          host: '${{ matrix.qt_host }}'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true

      - name: Capture arm64 Qt root
        run: |
          set -euo pipefail
          echo "ARM64_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Install Qt ${{ matrix.qt_version }} (armeabi-v7a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ matrix.qt_version }}'
          host: '${{ matrix.qt_host }}'
          target: 'android'
          arch: 'android_armv7'
          cache: true

      - name: Capture armv7 Qt root
        run: |
          set -euo pipefail
          echo "ARMV7_QT_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          find "$QT_ROOT_DIR/bin" -maxdepth 1 -type f -exec chmod +x {} + 2>/dev/null || true

      - name: Adapt Gradle wrapper, manifest, and compile SDK for ${{ matrix.label }}
        run: |
          set -euo pipefail

          sed -i "s|gradle-9.5.1|gradle-${{ matrix.gradle }}|" \
            android/gradle/wrapper/gradle-wrapper.properties

          sed -i 's/android:extractNativeLibs="false"/android:extractNativeLibs="true"/' \
            android/AndroidManifest.xml

          if grep -q 'compileSdkVersion' android/build.gradle; then
            sed -i -E "s|compileSdkVersion[[:space:]]+.*|compileSdkVersion ${{ matrix.sdk_platform_num }}|" \
              android/build.gradle
            grep -q '^android.bundle.enableUncompressedNativeLibs=' android/gradle.properties \
              || echo 'android.bundle.enableUncompressedNativeLibs=false' >> android/gradle.properties
            echo "--- compileSdkVersion ---"
            grep 'compileSdkVersion' android/build.gradle
          else
            echo "::warning::android/build.gradle has no compileSdkVersion line; leaving it alone"
          fi

          # Belt and braces: force aapt2 from the matching build-tools.
          echo "android.aapt2FromMavenOverride=$ANDROID_HOME/build-tools/${{ matrix.build_tools }}/aapt2" \
            >> android/gradle.properties

          echo "--- gradle wrapper ---"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          echo "--- extractNativeLibs ---"
          grep -o 'extractNativeLibs="[^"]*"' android/AndroidManifest.xml

          if [ ! -f android/gradle.properties ]; then
            echo "# Generated by CI" > android/gradle.properties
          fi
          grep -q '^android.bundle.enableUncompressedNativeLibs=' android/gradle.properties \
            || echo 'android.bundle.enableUncompressedNativeLibs=false' >> android/gradle.properties
          grep -q '^android.useAndroidX=' android/gradle.properties \
            || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -q '^android.suppressUnsupportedCompileSdk=' android/gradle.properties \
            || echo 'android.suppressUnsupportedCompileSdk=36' >> android/gradle.properties

      - name: Configure and build (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          sh "$ARM64_QT_ROOT/bin/qt-cmake" -S . -B build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_MIN_SDK_VERSION=${{ matrix.min_sdk }} \
            -DQT_ANDROID_TARGET_SDK_VERSION=${{ matrix.target_sdk }}
          cmake --build build-arm64 --parallel
          cmake --build build-arm64 --target apk

      - name: Configure and build (armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          sh "$ARMV7_QT_ROOT/bin/qt-cmake" -S . -B build-armv7 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRANSLATION_ENABLED=FALSE \
            -DQT_ANDROID_MIN_SDK_VERSION=${{ matrix.min_sdk }} \
            -DQT_ANDROID_TARGET_SDK_VERSION=${{ matrix.target_sdk }}
          cmake --build build-armv7 --parallel
          cmake --build build-armv7 --target apk

      - name: Merge arm64-v8a + armeabi-v7a into universal APK
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT"

          APK64="$(find build-arm64 -name '*.apk' -not -path '*intermediates*' -print -quit)"
          APK32="$(find build-armv7 -name '*.apk' -not -path '*intermediates*' -print -quit)"
          test -n "$APK64" || { echo "::error::arm64 APK not found"; find build-arm64 -name '*.apk' >&2; exit 1; }
          test -n "$APK32" || { echo "::error::armv7 APK not found"; find build-armv7 -name '*.apk' >&2; exit 1; }

          unzip -l "$APK64" | grep -q 'lib/arm64-v8a/'   || { echo "::error::arm64 APK lacks lib/arm64-v8a"; exit 1; }
          unzip -l "$APK32" | grep -q 'lib/armeabi-v7a/' || { echo "::error::armv7 APK lacks lib/armeabi-v7a"; exit 1; }

          rm -rf "$ROOT/merge"
          mkdir -p "$ROOT/merge/base" "$ROOT/merge/other" "$ROOT/merge/merged"

          unzip -q "$APK32" -d merge/base
          unzip -q "$APK64" -d merge/other

          cp -a "$ROOT/merge/base/." "$ROOT/merge/merged/"
          mkdir -p "$ROOT/merge/merged/lib"
          rm -rf "$ROOT/merge/merged/lib/arm64-v8a"
          cp -a "$ROOT/merge/other/lib/arm64-v8a" "$ROOT/merge/merged/lib/"
          rm -rf "$ROOT/merge/merged/META-INF"

          cd "$ROOT/merge/merged"
          zip -qr ../merged-unaligned.apk . \
            -x 'resources.arsc'
          zip -q -0 ../merged-unaligned.apk resources.arsc

      - name: Align and sign universal APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PWD }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cd "$ROOT"
          mkdir -p "$ROOT/dist"

          ZIPALIGN="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/${{ matrix.build_tools }}/zipalign"

          if "$ZIPALIGN" 2>&1 | grep -q -- '-P '; then
            "$ZIPALIGN" -f -P 16 4 "$ROOT/merge/merged-unaligned.apk" \
              "$ROOT/merge/aligned.apk"
            "$ZIPALIGN" -c -P 16 4 "$ROOT/merge/aligned.apk"
          else
            "$ZIPALIGN" -f -p 4 "$ROOT/merge/merged-unaligned.apk" \
              "$ROOT/merge/aligned.apk"
            "$ZIPALIGN" -c -p 4 "$ROOT/merge/aligned.apk"
          fi

          OUT="$ROOT/dist/firebird-emu-${{ matrix.label }}-universal.apk"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/${{ matrix.build_tools }}/apksigner"

          if [ -n "${ANDROID_KEYSTORE_PWD:-}" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$ROOT/keystore.jks"
            "$APKSIGNER" sign \
              --ks "$ROOT/keystore.jks" \
              --ks-key-alias firebirdemugh \
              --ks-pass "pass:${ANDROID_KEYSTORE_PWD}" \
              --key-pass "pass:${ANDROID_KEYSTORE_PWD}" \
              --out "$OUT" "$ROOT/merge/aligned.apk"
          else
            echo "::warning::No release keystore available; signing with the debug key."
            keytool -genkeypair -keystore "$ROOT/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            "$APKSIGNER" sign \
              --ks "$ROOT/debug.keystore" --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out "$OUT" "$ROOT/merge/aligned.apk"
          fi
          "$APKSIGNER" verify --print-certs "$OUT"

          AAPT2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/${{ matrix.build_tools }}/aapt2"
          echo "--- badging ---"
          "$AAPT2" dump badging "$OUT" | grep -E "^(package|native-code|sdkVersion|targetSdkVersion):" || true

          NATIVE="$("$AAPT2" dump badging "$OUT" | sed -n "s/^native-code: \(.*\)/\1/p")"
          echo "$NATIVE" | grep -q "arm64-v8a"   || { echo "::error::APK lacks arm64-v8a"; exit 1; }
          echo "$NATIVE" | grep -q "armeabi-v7a" || { echo "::error::APK lacks armeabi-v7a"; exit 1; }

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: firebird-emu-${{ matrix.label }}-universal
          path: dist/firebird-emu-${{ matrix.label }}-universal.apk
          if-no-files-found: error

  package-legacy:
    name: Bundle legacy APKs
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04

    steps:
      - name: Download Android 6-7 universal APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: firebird-emu-android6-7-universal
          path: legacy-apks/android6-7

      - name: Download Android 8 universal APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: firebird-emu-android8-universal
          path: legacy-apks/android8

      - name: Confirm we have something to package
        run: |
          if [ ! -d legacy-apks ] || [ -z "$(find legacy-apks -name '*.apk')" ]; then
            echo "No legacy APKs found — the build jobs must have failed." >&2
            exit 1
          fi
          find legacy-apks -name '*.apk' | sort

      - name: Add README and bundle
        run: |
          cat > legacy-apks/README.txt <<'EOF'
          Firebird Emu — legacy Android builds (universal APKs)

          firebird-emu-android6-7-universal.apk   Qt 6.4.3, Android 6.0+ (API 23)
          firebird-emu-android8-universal.apk     Qt 6.7.3, Android 8.0+ (API 26)

          Each APK contains native libraries for both 64-bit (arm64-v8a) and
          32-bit (armeabi-v7a) ARM devices, so a single file covers every
          supported phone. Install the APK matching your Android version.
          EOF

          zip -r legacyandroid.zip legacy-apks
          ls -la legacyandroid.zip

      - name: Upload legacy bundle
        uses: actions/upload-artifact@v7
        with:
          name: legacyandroid
          path: legacyandroid.zip
          if-no-files-found: error
