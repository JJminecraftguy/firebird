name: Build for Windows

on:
  push:
    branches: [ master, ci/windows ]
  pull_request:
    branches: [ master, ci/windows ]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build: ${{ matrix.arch }}"
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit: The official Qt 6.12.0 MinGW kit, built with the MSYS2 compiler.
          - arch: win64
            msystem: MINGW64
            msys_pkg: x86_64
            msys_env: mingw64
            qt_version: '6.12.0'
            pe_format: 'pei-x86-64'
          # 32-bit: Qt doesn't provide 32-bit binaries for Qt 6, so a self-built
          # Qt 6.12.0 is used (qt/qt-6.12.0-win32.zip). It was built with the
          # MSYS2 MINGW32 toolchain, so that has to be used here as well.
          - arch: win32
            msystem: MINGW32
            msys_pkg: i686
            msys_env: mingw32
            qt_version: '6.12.0'
            pe_format: 'pei-i386'

    steps:
    - name: Checkout Git Repo
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Setup MSYS2 toolchain (${{ matrix.msystem }})
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: >-
          mingw-w64-${{ matrix.msys_pkg }}-toolchain
          mingw-w64-${{ matrix.msys_pkg }}-zlib

    - name: Install runtime libraries of the Qt kit (MSYS2)
      if: matrix.arch == 'win32'
      shell: msys2 {0}
      run: |
        pacman -S --needed --noconfirm \
          mingw-w64-${{ matrix.msys_pkg }}-pcre2 \
          mingw-w64-${{ matrix.msys_pkg }}-zstd \
          mingw-w64-${{ matrix.msys_pkg }}-libb2 \
          mingw-w64-${{ matrix.msys_pkg }}-brotli \
          || echo "::warning::Could not install all runtime libraries of Qt via pacman"

    - name: Add the MSYS2 toolchain to PATH
      shell: pwsh
      run: |
        $bin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "${{ matrix.msys_env }}\bin"
        if (-not (Test-Path "$bin\g++.exe")) { throw "No g++ in $bin" }
        "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "MSYS_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install Qt ${{ matrix.qt_version }} (official kit)
      if: matrix.arch == 'win64'
      uses: jurplel/install-qt-action@v4
      with:
        version: '${{ matrix.qt_version }}'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
        add-tools-to-path: true
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
        cache: true

    - name: Install Qt ${{ matrix.qt_version }} (self-built 32-bit kit)
      if: matrix.arch == 'win32'
      shell: pwsh
      run: |
        $zip = "qt\qt-6.12.0-win32.zip"
        if (-not (Test-Path $zip)) { throw "$zip is missing" }
        $qt = "C:\Qt\6.12.0\mingw_x32"
        New-Item -ItemType Directory -Force $qt | Out-Null
        7z x $zip "-o$qt" -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "Extracting $zip failed (is the archive complete?)" }
        foreach ($f in @(
            "bin\qmake.exe",
            "bin\windeployqt.exe",
            "lib\libQt6Core.a",
            "plugins\platforms\qwindows.dll",
            "lib\cmake\Qt6\Qt6Config.cmake")) {
          if (-not (Test-Path "$qt\$f")) { throw "Qt kit is incomplete, $f is missing" }
        }
        # qt.conf is only used by qmake queries in the deploy step; CMake
        # locates the kit via CMAKE_PREFIX_PATH and doesn't read qt.conf.
        Set-Content -Path "$qt\bin\qt.conf" -Value "[Paths]`nPrefix=.."
        "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "QT_ROOT_DIR=$qt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Verify toolchain and Qt
      shell: pwsh
      run: |
        g++ --version | Select-Object -First 1
        cmake --version | Select-Object -First 1
        qmake -v
        $v = (qmake -query QT_VERSION).Trim()
        if ($v -ne "${{ matrix.qt_version }}") { throw "Expected Qt ${{ matrix.qt_version }}, but qmake is $v" }
        $prefix = (qmake -query QT_INSTALL_PREFIX).Trim()
        Write-Host "Qt prefix: $prefix"
        if (-not (Test-Path "$prefix\bin\Qt6Core.dll")) { throw "qmake's prefix $prefix doesn't contain Qt" }
        if (-not (Test-Path "$prefix\lib\cmake\Qt6\Qt6Config.cmake")) {
          throw "Qt prefix $prefix has no CMake package config"
        }

    - name: Configure (CMake)
      shell: pwsh
      run: |
        # Qt 6.12's CMake package config lives under <prefix>/lib/cmake/Qt6;
        # pointing CMAKE_PREFIX_PATH at the kit root is the cross-platform way
        # to make find_package(Qt6) succeed. Same works for the official
        # win64_mingw kit and the self-built mingw_x32 kit.
        cmake -S . -B build `
          -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
        if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

    - name: Build firebird-emu
      shell: pwsh
      run: |
        cmake --build build --parallel 4
        if ($LASTEXITCODE -ne 0) { throw "make failed" }

    - name: Deploy Qt and runtime libraries
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path build -Recurse -Filter firebird-emu.exe | Select-Object -First 1
        if (-not $exe) { throw "firebird-emu.exe was not built" }

        # Make sure the executable has the right architecture, the JIT depends on it
        $fmt = objdump -f $exe.FullName | Select-String "file format"
        Write-Host $fmt
        if ($fmt -notmatch "${{ matrix.pe_format }}") { throw "Wrong architecture, expected ${{ matrix.pe_format }}" }

        $dist = "build\firebird-emu"
        New-Item -ItemType Directory $dist | Out-Null
        Copy-Item $exe.FullName $dist\

        windeployqt --qmldir=qml "$dist\firebird-emu.exe"
        if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

        # QML modules that are only imported by other QML modules (e.g. by
        # the fallback file dialog and the native styles) might not have
        # been found by the QML import scanner.
        $qtQml = (qmake -query QT_INSTALL_QML).Trim()
        foreach ($m in @("Qt\labs\folderlistmodel", "QtQuick\NativeStyle", "QtQml\WorkerScript", "QtQuick\Dialogs", "QtQuick\Layouts", "QtQuick\Window")) {
          if ((Test-Path "$qtQml\$m") -and -not (Test-Path "$dist\qml\$m")) {
            Write-Host "Adding QML module $m"
            New-Item -ItemType Directory -Force (Split-Path "$dist\qml\$m") | Out-Null
            Copy-Item "$qtQml\$m" "$dist\qml\$m" -Recurse
          }
        }

        # windeployqt only knows about Qt, but not about the other libraries
        # that Qt (the 32-bit kit is built with MSYS2 libraries) or the compiler
        # runtime depend on. Resolve the imports of all deployed files.
        $qtBin = (qmake -query QT_INSTALL_BINS).Trim()
        $sys = Join-Path $env:SystemRoot "System32"
        function Get-Imports($file) {
          objdump -p $file 2>$null | Select-String 'DLL Name:\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
        }
        do {
          $added = $false
          foreach ($f in Get-ChildItem $dist -Recurse -Include *.dll,*.exe) {
            foreach ($dll in Get-Imports $f.FullName) {
              if (Test-Path (Join-Path $dist $dll)) { continue }
              foreach ($dir in @($env:MSYS_BIN, $qtBin)) {
                $src = Join-Path $dir $dll
                if (Test-Path $src) {
                  Write-Host "Adding $dll (from $dir)"
                  Copy-Item $src $dist
                  $added = $true
                  break
                }
              }
            }
          }
        } while ($added)

        $missing = @()
        foreach ($f in Get-ChildItem $dist -Recurse -Include *.dll,*.exe) {
          foreach ($dll in Get-Imports $f.FullName) {
            if ($dll -match '^(api|ext)-ms-') { continue }
            if (Test-Path (Join-Path $dist $dll)) { continue }
            if (Test-Path (Join-Path $sys $dll)) { continue }
            $missing += "$dll (needed by $($f.Name))"
          }
        }
        if ($missing.Count -gt 0) {
          $missing | Sort-Object -Unique | ForEach-Object { Write-Host "::error::Unresolved dependency: $_" }
          throw "Some dependencies could not be found, the application would not start."
        }

        $size = (Get-ChildItem $dist -Recurse | Measure-Object Length -Sum).Sum / 1MB
        Write-Host ("Deployed {0:N1} MiB" -f $size)

    - name: Upload zip
      uses: actions/upload-artifact@v7
      with:
          name: firebird-emu-${{ matrix.arch }}
          # Use a wildcard to force a subfolder
          path: "build/*-emu/"
          if-no-files-found: error
